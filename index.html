  document.getElementById('settingsPanel').classList.toggle('open');
});
refreshSettingsUI();

function deadzone(v) { return Math.abs(v) < settings.deadzone ? 0 : v; }

document.getElementById('connectBtn').addEventListener('click', async () => {
  const statusEl = document.getElementById('status');
  if (!('hid' in navigator)) {
    statusEl.textContent = 'WebHID非対応ブラウザです';
    statusEl.className = 'bad';
    return;
  }
  try {
    const devices = await navigator.hid.requestDevice({ filters: [{ vendorId: 0x046d }] });
    if (devices.length === 0) { statusEl.textContent = '未選択'; statusEl.className = 'bad'; return; }
    const device = devices[0];
    await device.open();
    statusEl.textContent = '接続: ' + device.productName;
    statusEl.className = 'ok';
    device.addEventListener('inputreport', (event) => {
      const d = event.data;
      if (event.reportId === 1 && d.byteLength >= 6) {
        sm.x = deadzone(d.getInt16(0, true) / AXIS_MAX);
        sm.y = deadzone(d.getInt16(2, true) / AXIS_MAX);
        sm.z = deadzone(d.getInt16(4, true) / AXIS_MAX);
      } else if (event.reportId === 2 && d.byteLength >= 6) {
        sm.rx = deadzone(d.getInt16(0, true) / AXIS_MAX);
        sm.ry = deadzone(d.getInt16(2, true) / AXIS_MAX);
        sm.rz = deadzone(d.getInt16(4, true) / AXIS_MAX);
      }
    });
  } catch (e) {
    statusEl.textContent = 'エラー: ' + e.message;
    statusEl.className = 'bad';
  }
});

// ---- per-frame camera update: pure flight-stick integration, no pivot ----
let lastTime = performance.now();
let fpsSmoothed = 60;
let lastResScaleCheck = performance.now();
let slowFrameStreak = 0;
// The framerate we defend, derived from whatever cap is in force. Defending
// the cap itself is incoherent -- frames land exactly there, jitter dips
// under, and the controller ends up treating its own pacing as overload.
function fpsFloor() { return settings.fpsCap > 0 ? settings.fpsCap * 0.8 : 30; }
function fpsGood()  { return settings.fpsCap > 0 ? settings.fpsCap * 0.95 : 40; }
let qualitySettle = 0;   // frames to ignore after a resolution change
let idleMs = 0;          // how long the camera has been sitting still
// Last camera state the HUD overlays were drawn for, so they can be skipped
// entirely while nothing moves.
const lastOverlayPos = new Cesium.Cartesian3(NaN, NaN, NaN);
let lastOverlayYaw = NaN, lastOverlayPitch = NaN;
let overlayDirty = true;

// Single place that changes resolutionScale, so the settle window can never
// be forgotten at one of the call sites.
function setResolutionScale(v) {
  const next = Cesium.Math.clamp(v, settings.minResolutionScale, settings.maxResolutionScale);
  if (Math.abs(next - currentResolutionScale) < 1e-4) return;
  currentResolutionScale = next;
  viewer.resolutionScale = next;
  qualitySettle = 4;
}
// globe.getHeight() isn't free once real terrain tiles are involved. Even
// throttled, calling it FROM the render loop (tick/rAF) still occasionally
// stalls a frame right when it runs, which shows up as periodic judder no
// amount of smoothing the resulting NUMBER can fix -- the frame time itself
// is what's uneven. Moved the sampling to its own setInterval, fully outside
// the render loop, so it can never block a rendered frame; tick() only ever
// reads the last sampled value and smoothly eases toward it.
let targetHeightAboveGround = 0;
let smoothedHeightAboveGround = 0;
setInterval(() => {
  const carto = Cesium.Cartographic.fromCartesian(viewer.camera.position);
  const groundHeight = viewer.scene.globe.getHeight(carto) ?? 0;
  targetHeightAboveGround = Math.max(0, carto.height - groundHeight);
}, 150);

function tick() {
  const now = performance.now();
  const rawDt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;

  // Integrate against a smoothed frame time, not the raw one. Frame times
  // are noisy even at a steady average, and feeding that jitter straight
  // into the motion equations turns it into visible unevenness in the
  // movement itself. Averaging it out costs a little timing accuracy and
  // buys a lot of apparent smoothness.
  dtSmoothed = dtSmoothed > 0 ? dtSmoothed + (rawDt - dtSmoothed) * 0.15 : rawDt;
  const dt = dtSmoothed;

  // Low-pass the stick so the camera eases into and out of motion instead of
  // tracking every tremor in the hand. tau is the time constant in seconds;
  // the exponential form makes the response identical regardless of frame
  // rate, which a plain per-frame lerp would not be.
  const tau = settings.inputSmoothing;
  const k = tau > 0 ? 1 - Math.exp(-rawDt / tau) : 1;
  smIn.x += (sm.x - smIn.x) * k;
  smIn.y += (sm.y - smIn.y) * k;
  smIn.z += (sm.z - smIn.z) * k;
  smIn.rx += (sm.rx - smIn.rx) * k;
  smIn.ry += (sm.ry - smIn.ry) * k;
  smIn.rz += (sm.rz - smIn.rz) * k;

  const cam = viewer.camera;

  // Ease toward the (separately-sampled) target rather than snapping.
  smoothedHeightAboveGround += (targetHeightAboveGround - smoothedHeightAboveGround) * Math.min(1, dt * 3);
  const heightAboveGround = smoothedHeightAboveGround;
  const carto = Cesium.Cartographic.fromCartesian(cam.position);

  // ---- Rotation: explicit yaw/pitch state, rebuilt from the local East-
  // North-Up frame every frame -- NOT accumulated via repeated cam.look()
  // calls. The old look()-based approach round-tripped through the camera's
  // current orientation each frame, which drifts/becomes unstable exactly
  // when looking near straight-down (classic gimbal-lock symptom: erratic
  // roll). Keeping yaw/pitch as independent numbers and reconstructing
  // direction/up from them fresh every frame makes that class of bug
  // impossible by construction. Pitch is clamped just short of vertical
  // (90.5°) since roll is genuinely undefined at EXACTLY straight down/up,
  // in any representation -- not a bug, a real singularity everyone works
  // around this way (flight sims included).
  yaw += smIn.rz * settings.rotSpeed * dt;

  // Ease into the pitch limit instead of hard-clamping: hitting a hard wall
  // at ±89.5° felt like a sudden jolt (input kept going, motion just
  // stopped dead). Scaling the delta down as pitch nears the limit gives a
  // smooth deceleration instead, while still avoiding the true singularity
  // at exactly ±90°.
  const PITCH_LIMIT = Cesium.Math.toRadians(89.95); // exactly 90° is the true singularity; this is close enough to feel like straight down
  const PITCH_EASE_MARGIN = Cesium.Math.toRadians(15);
  let pitchDelta = smIn.rx * settings.rotSpeed * dt; // sign flipped: felt reversed to the user
  if (pitchDelta > 0) {
    const remaining = Cesium.Math.clamp((PITCH_LIMIT - pitch) / PITCH_EASE_MARGIN, 0, 1);
    pitchDelta *= remaining;
  } else if (pitchDelta < 0) {
    const remaining = Cesium.Math.clamp((pitch + PITCH_LIMIT) / PITCH_EASE_MARGIN, 0, 1);
    pitchDelta *= remaining;
  }
  pitch = Cesium.Math.clamp(pitch + pitchDelta, -PITCH_LIMIT, PITCH_LIMIT);

  const enu = Cesium.Transforms.eastNorthUpToFixedFrame(cam.positionWC);
  const east = Cesium.Matrix4.getColumn(enu, 0, new Cesium.Cartesian3());
  const north = Cesium.Matrix4.getColumn(enu, 1, new Cesium.Cartesian3());
  const zenith = Cesium.Matrix4.getColumn(enu, 2, new Cesium.Cartesian3());

  // direction = horizontal component (yaw-rotated east/north blend) tilted
  // up/down by pitch toward zenith.
  const horiz = Cesium.Cartesian3.add(
    Cesium.Cartesian3.multiplyByScalar(east, Math.sin(yaw), new Cesium.Cartesian3()),
    Cesium.Cartesian3.multiplyByScalar(north, Math.cos(yaw), new Cesium.Cartesian3()),
    new Cesium.Cartesian3()
  );
  const direction = Cesium.Cartesian3.normalize(Cesium.Cartesian3.add(
    Cesium.Cartesian3.multiplyByScalar(horiz, Math.cos(pitch), new Cesium.Cartesian3()),
    Cesium.Cartesian3.multiplyByScalar(zenith, Math.sin(pitch), new Cesium.Cartesian3()),
    new Cesium.Cartesian3()
  ), new Cesium.Cartesian3());
  const right = Cesium.Cartesian3.normalize(
    Cesium.Cartesian3.cross(direction, zenith, new Cesium.Cartesian3()), new Cesium.Cartesian3());
  const up = Cesium.Cartesian3.normalize(
    Cesium.Cartesian3.cross(right, direction, new Cesium.Cartesian3()), new Cesium.Cartesian3());

  // ---- Translation: world/yaw-based basis, not the pitch-tilted local
  // look direction. Forward/back/left/right move on the horizontal plane
  // (yaw only -- pitch is ignored), and up/down is always true vertical.
  // This means looking down at the ground to examine it doesn't also make
  // "forward" dive toward it -- movement and where you're looking are
  // decoupled, which reads as more "world-anchored". Speed scales with
  // altitude so ground-relative speed stays roughly constant regardless of
  // how high up we are.
  const worldRight = Cesium.Cartesian3.normalize(
    Cesium.Cartesian3.cross(horiz, zenith, new Cesium.Cartesian3()), new Cesium.Cartesian3());
  if (smIn.x || smIn.y || smIn.z) {
    // heightAboveGround computed once at the top of tick() (not sea-level
    // altitude) -- matters near mountains, e.g. hovering just above Fuji's
    // ~3776m peak should feel like being near the ground and slow down.
    const speed = settings.moveSpeed + heightAboveGround * settings.altFactor;
    const delta = new Cesium.Cartesian3();
    Cesium.Cartesian3.add(delta, Cesium.Cartesian3.multiplyByScalar(worldRight, smIn.x * speed * dt, new Cesium.Cartesian3()), delta);
    Cesium.Cartesian3.add(delta, Cesium.Cartesian3.multiplyByScalar(zenith, -smIn.z * speed * dt, new Cesium.Cartesian3()), delta);
    Cesium.Cartesian3.add(delta, Cesium.Cartesian3.multiplyByScalar(horiz, -smIn.y * speed * dt, new Cesium.Cartesian3()), delta);
    Cesium.Cartesian3.add(cam.position, delta, cam.position);
  }

  cam.setView({ orientation: { direction, up } });

  document.getElementById('alt').textContent =
    `${carto.height.toFixed(0)} (地表から ${heightAboveGround.toFixed(0)})`;
  const curSpeed = settings.moveSpeed + heightAboveGround * settings.altFactor;
  document.getElementById('speed').textContent =
    (Math.hypot(smIn.x, smIn.y, smIn.z) * curSpeed).toFixed(1);
  document.getElementById('rawvals').textContent =
    `x=${sm.x.toFixed(2)} y=${sm.y.toFixed(2)} z=${sm.z.toFixed(2)} | rx=${sm.rx.toFixed(2)} ry=${sm.ry.toFixed(2)} rz=${sm.rz.toFixed(2)}`;

  // FPS (smoothed) tells us if rendering itself is the bottleneck; pending
  // tile requests tell us if we're instead waiting on network/tile loading.
  // Distinguishing the two was previously just a guess.
  const instFps = dt > 0 ? 1 / dt : 60;
  // Changing resolutionScale forces Cesium to reallocate its framebuffers,
  // which costs one visibly slow frame. Measuring that frame would be
  // self-defeating: the drop-side smoothing below is deliberately violent,
  // so the cost of raising quality got mistaken for the scene being too
  // heavy, which blocked the next raise. That feedback loop is why quality
  // never climbed back after the view came to rest. Skip a few frames after
  // any change and let the pipeline settle before trusting the numbers.
  // Is the camera actually being flown right now? Framerate only matters
  // while something is moving; once the view is parked, a sharp picture is
  // worth far more than headroom nobody is using.
  // Judged on the SMOOTHED input, not the raw stick: with inertia the camera
  // is still coasting for a moment after the hand lets go, and treating that
  // as "parked" would raise quality mid-glide and then drop it again. The
  // smoothed value decays asymptotically, so it needs a threshold rather
  // than a test against exactly zero.
  const IDLE_EPS = 0.004;
  const moving = Math.abs(smIn.x) > IDLE_EPS || Math.abs(smIn.y) > IDLE_EPS ||
                 Math.abs(smIn.z) > IDLE_EPS || Math.abs(smIn.rx) > IDLE_EPS ||
                 Math.abs(smIn.ry) > IDLE_EPS || Math.abs(smIn.rz) > IDLE_EPS;
  idleMs = moving ? 0 : idleMs + dt * 1000;
  const parked = idleMs > 350;

  if (qualitySettle > 0) {
    qualitySettle--;
  } else {
    // Asymmetric smoothing: react fast to a drop, slowly to a recovery. A
    // symmetric average hides short stalls behind the good frames either
    // side of them, which is exactly when we most want to have cut back.
    fpsSmoothed += (instFps - fpsSmoothed) * (instFps < fpsSmoothed ? 0.4 : 0.05);

    // Emergency path only. This used to fire on any frame under the target,
    // which was self-defeating once a frame-rate cap existed: a capped 30fps
    // lands frames AT 30, jitter puts many of them just under, and the
    // controller read its own cap as the scene being too heavy and collapsed
    // the resolution to minimum within a second. It now waits for frames
    // that are genuinely crawling, and even then steps gently -- the
    // half-second controller below does the ordinary work.
    if (!parked && instFps < 12 && currentResolutionScale > settings.minResolutionScale) {
      slowFrameStreak++;
      if (slowFrameStreak >= 3) {
        slowFrameStreak = 0;
        setResolutionScale(currentResolutionScale - 0.08);
      }
    } else {
      slowFrameStreak = 0;
    }
  }
  document.getElementById('fps').textContent = fpsSmoothed.toFixed(0);
  document.getElementById('pendingTiles').textContent = Cesium.RequestScheduler.statistics.numberOfActiveRequests;

  // Twice a second, trade quality for framerate or claim it back.
  //
  // Two rules matter here. First, the framerate we defend has to sit BELOW
  // any cap we've imposed on ourselves -- defending the cap itself means
  // fighting our own frame pacing forever. Second, terrain detail is spent
  // before resolution: coarser ground is far less noticeable than a soft
  // picture, so resolution is only touched once terrain has nothing left to
  // give, or when the shortfall is bad enough that terrain alone won't fix
  // it. That ordering is what keeps the image sharp at a merely-adequate
  // framerate instead of collapsing to minimum at the first hiccup.
  if (qualitySettle === 0 && now - lastResScaleCheck > 500) {
    lastResScaleCheck = now;
    const floor = fpsFloor(), good = fpsGood();
    const deficit = Cesium.Math.clamp((floor - fpsSmoothed) / floor, 0, 1);
    if (parked) {
      // Parked: climb back to full quality unconditionally. Recovery used to
      // be gated on reaching a target framerate, so on a machine that can't
      // hit it even at minimum resolution the picture stayed pinned at its
      // worst forever -- the harder the GPU struggled, the more permanent
      // the degradation became. Standing still is precisely when framerate
      // stops mattering, so nothing here is gated on it.
      if (currentResolutionScale < settings.maxResolutionScale) {
        setResolutionScale(currentResolutionScale + 0.05);
      } else if (currentTerrainSSE > settings.terrainDetail) {
        currentTerrainSSE = Math.max(settings.terrainDetail, currentTerrainSSE - 0.5);
        viewer.scene.globe.maximumScreenSpaceError = currentTerrainSSE;
      }
    } else if (fpsSmoothed < floor) {
      const terrainSpent = currentTerrainSSE >= TERRAIN_SSE_WORST;
      if (!terrainSpent) {
        currentTerrainSSE = Math.min(TERRAIN_SSE_WORST, currentTerrainSSE + 0.5 + 2 * deficit);
        viewer.scene.globe.maximumScreenSpaceError = currentTerrainSSE;
      }
      // Resolution is the last resort: only once terrain is exhausted, or
      // when we're missing by a wide margin and coarsening ground alone
      // clearly isn't going to close the gap.
      if ((terrainSpent || deficit > 0.35) && currentResolutionScale > settings.minResolutionScale) {
        setResolutionScale(currentResolutionScale - (0.03 + 0.07 * deficit));
      }
    } else if (fpsSmoothed > good) {
      if (currentResolutionScale < settings.maxResolutionScale) {
        setResolutionScale(currentResolutionScale + 0.05);
      } else if (currentTerrainSSE > settings.terrainDetail) {
        currentTerrainSSE = Math.max(settings.terrainDetail, currentTerrainSSE - 0.5);
        viewer.scene.globe.maximumScreenSpaceError = currentTerrainSSE;
      }
    }
  }
  document.getElementById('resScale').textContent =
    `${Math.round(currentResolutionScale * 100)}% (${viewer.canvas.width}x${viewer.canvas.height})`;
  document.getElementById('terrainSSE').textContent = currentTerrainSSE.toFixed(1);

  // Heading (compass direction, 0=North matching our yaw convention) and
  // pitch (look up/down angle), for "which way am I facing" awareness.
  const headingDeg = ((Cesium.Math.toDegrees(yaw) % 360) + 360) % 360;

  // All of the overlay work below is a pure function of where the camera is
  // and where it points, so when neither has changed the answer is the one
  // already on screen. Recomputing it anyway was the single largest thing
  // this app did while sitting completely still. The terrain-occlusion pass
  // can still flip a label's visibility from its own timer, so it asks for a
  // refresh when it does.
  const camMoved =
    Math.abs(cam.position.x - lastOverlayPos.x) > 0.5 ||
    Math.abs(cam.position.y - lastOverlayPos.y) > 0.5 ||
    Math.abs(cam.position.z - lastOverlayPos.z) > 0.5 ||
    Math.abs(yaw - lastOverlayYaw) > 1e-5 ||
    Math.abs(pitch - lastOverlayPitch) > 1e-5;

  if (camMoved || overlayDirty) {
    overlayDirty = false;
    Cesium.Cartesian3.clone(cam.position, lastOverlayPos);
    lastOverlayYaw = yaw;
    lastOverlayPitch = pitch;

    drawCompass(headingDeg);
    drawAttitude(Cesium.Math.toDegrees(pitch));
    updatePeakLabels();
    updateSkyCompass(carto);
    updateMinimap(carto, headingDeg);
  }

  requestAnimationFrame(tick);
}

// ---- Graphical compass: fixed N-up dial, needle rotates to heading ----
const compassCtx = document.getElementById('compass').getContext('2d');
function drawCompass(headingDeg) {
  const ctx = compassCtx, w = 80, h = 80, r = 34, cx = w / 2, cy = h / 2;
  ctx.clearRect(0, 0, w, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const labels = [['N', 0], ['E', 90], ['S', 180], ['W', 270]];
  for (const [label, deg] of labels) {
    const a = Cesium.Math.toRadians(deg);
    ctx.fillStyle = label === 'N' ? '#ff5252' : '#fff';
    ctx.fillText(label, cx + Math.sin(a) * (r - 10), cy - Math.cos(a) * (r - 10));
  }

  // needle points toward current heading
  const hr = Cesium.Math.toRadians(headingDeg);
  ctx.strokeStyle = '#4fc3f7';
  ctx.fillStyle = '#4fc3f7';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.sin(hr) * (r - 16), cy - Math.cos(hr) * (r - 16));
  ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = '#fff';
  ctx.font = '10px sans-serif';
  ctx.fillText(headingDeg.toFixed(0) + '°', cx, h - 6);
}

// ---- Graphical attitude indicator: classic aviation-style artificial
// horizon (sky/ground split line tilts+shifts with pitch, fixed aircraft
// marker in the center) ----
const attitudeCtx = document.getElementById('attitude').getContext('2d');
function drawAttitude(pitchDeg) {
  const ctx = attitudeCtx, w = 80, h = 80, cx = w / 2, cy = h / 2, r = 34;
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();

  // horizon line shifts vertically with pitch (roll is always 0 in this
  // app, so it never tilts -- matches "up always points to the sky").
  const pxPerDeg = 1.4;
  const offset = pitchDeg * pxPerDeg;
  ctx.fillStyle = '#6fa8dc'; // sky
  ctx.fillRect(0, 0, w, cy + offset + h);
  ctx.fillStyle = '#8a6a52'; // ground
  ctx.fillRect(0, cy + offset, w, h);
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, cy + offset); ctx.lineTo(w, cy + offset); ctx.stroke();
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();

  // fixed center marker (represents the nose/forward direction)
  ctx.strokeStyle = '#ff5252';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - 12, cy); ctx.lineTo(cx - 4, cy);
  ctx.moveTo(cx + 4, cy); ctx.lineTo(cx + 12, cy);
  ctx.moveTo(cx, cy - 3); ctx.lineTo(cx, cy + 3);
  ctx.stroke();

  ctx.fillStyle = '#fff';
  ctx.font = '10px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(pitchDeg.toFixed(0) + '°', cx, h - 6);
}
requestAnimationFrame(tick);

// ---- Startup gate.
// The camera starts parked over Fuji, and for the first few seconds that view
// is a blue sphere with tiles popping in. Holding the curtain until the scene
// reports itself loaded means the first thing seen is actual terrain.
//
// It has to be escapable: globe.tilesLoaded can stay false indefinitely on a
// slow connection, and a loading screen with no way out would be worse than
// an unfinished view. So there's a hard timeout and a skip button.
(function startupGate() {
  const el = document.getElementById('loading');
  const bar = document.getElementById('loadingBar');
  const msg = document.getElementById('loadingMsg');
  const started = performance.now();
  const MAX_WAIT = 12000;
  let finished = false;

  function finish(reason) {
    if (finished) return;
    finished = true;
    clearInterval(poll);
    bar.style.width = '100%';
    el.classList.add('done');
    setTimeout(() => el.remove(), 600);
    // The gate held the first frames back, so make sure the overlays are
    // drawn for wherever the camera actually ended up.
    overlayDirty = true;
  }

  document.getElementById('loadingSkip').addEventListener('click', () => finish('skipped'));

  const poll = setInterval(() => {
    const waited = performance.now() - started;
    const loaded = viewer.scene.globe.tilesLoaded;
    const pending = Cesium.RequestScheduler.statistics.numberOfActiveRequests;

    // No honest completion percentage exists here -- Cesium doesn't publish
    // "tiles still to fetch". Show elapsed-time progress, which at least
    // moves steadily and reaches the end exactly when the timeout does.
    bar.style.width = Math.min(95, (waited / MAX_WAIT) * 100) + '%';
    if (pending > 0) msg.textContent = `地形とタイルを読み込んでいます… (${pending})`;

    if (loaded && pending === 0 && waited > 800) finish('loaded');
    else if (waited > MAX_WAIT) finish('timeout');
  }, 200);
})();

// Persist tile cache across sessions: a service worker cache-first-fetches
// OpenTopoMap/ArcGIS tiles into Cache Storage so a previously-flown-over
// area loads instantly next time instead of re-downloading.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW registration failed', e));
}

// Without this the tile cache is only "best-effort": the browser is free to
// evict the whole origin's storage whenever disk gets tight, which is why a
// cache that looked fine last session can come back empty. persist() asks
// for durable storage instead. Chrome grants it silently based on
// engagement rather than prompting, so it may stay false for a while.
async function updateCacheStatus() {
  const el = document.getElementById('cacheStatus');
  if (!el || !navigator.storage) return;
  try {
    const persisted = await navigator.storage.persisted();
    const est = await navigator.storage.estimate();
    const mb = (est.usage / 1048576).toFixed(0);
    el.textContent = `${mb}MB ${persisted ? '(永続)' : '(一時)'}`;
    el.style.color = persisted ? '#8f8' : '#fc8';
  } catch (e) { /* storage API unavailable -- leave the placeholder */ }
}
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().then(updateCacheStatus).catch(() => {});
  setInterval(updateCacheStatus, 5000);
}

// ---- Minimap: real map tiles as background, with current position and
// nearby mountains drawn on top each frame. Local-zoom, player-centered
// view (NOT the whole of Japan squeezed into one small canvas -- that made
// every dot too close together to read). Tiles for a 3x3 grid around the
// player are fetched once and reused; a fresh grid is only fetched when the
// player crosses into a different tile.
function tileXFrac(lon, z) { return (lon + 180) / 360 * Math.pow(2, z); }
function tileYFrac(lat, z) {
  const r = lat * Math.PI / 180;
  return (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z);
}

const MINIMAP_GRID = 3;  // 3x3 tiles fetched around the player each recenter
const minimapCanvas = document.getElementById('minimap');
const minimapCtx = minimapCanvas.getContext('2d');
let minimapBg = null;          // offscreen canvas, MINIMAP_GRID*256 square
let minimapOriginTileX = null; // top-left tile of the currently-loaded grid
let minimapOriginTileY = null;
let minimapCenterTileX = null; // tile the grid is centered on -- recenter trigger
let minimapCenterTileY = null;
let minimapLoadedZoom = null;  // zoom the current grid was fetched at

function ensureMinimapTiles(centerTileX, centerTileY, zoom) {
  if (centerTileX === minimapCenterTileX && centerTileY === minimapCenterTileY
      && zoom === minimapLoadedZoom) return;
  minimapCenterTileX = centerTileX;
  minimapCenterTileY = centerTileY;
  minimapLoadedZoom = zoom;
  const half = Math.floor(MINIMAP_GRID / 2);
  minimapOriginTileX = centerTileX - half;
  minimapOriginTileY = centerTileY - half;
  const bg = document.createElement('canvas');
  bg.width = bg.height = MINIMAP_GRID * 256;
  const bgCtx = bg.getContext('2d');
  for (let dx = 0; dx < MINIMAP_GRID; dx++) {
    for (let dy = 0; dy < MINIMAP_GRID; dy++) {
      const tx = minimapOriginTileX + dx, ty = minimapOriginTileY + dy;
      const img = new Image();
      img.crossOrigin = 'anonymous';
      // Assigned to minimapBg immediately below (not on load) -- tiles draw
      // into it progressively as each finishes, so the map fills in instead
      // of staying blank until every one of the 9 is done.
      img.onload = () => bgCtx.drawImage(img, dx * 256, dy * 256);
      // Plain OSM here rather than the OpenTopoMap used for the 3D globe:
      // at minimap size the topo shading/contours turn into visual noise,
      // while OSM's flat styling keeps roads, towns and coastline legible.
      img.src = `https://tile.openstreetmap.org/${zoom}/${tx}/${ty}.png`;
    }
  }
  minimapBg = bg;
}

function lonLatToMinimapPx(lon, lat, zoom) {
  const x = (tileXFrac(lon, zoom) - minimapOriginTileX) * 256;
  const y = (tileYFrac(lat, zoom) - minimapOriginTileY) * 256;
  return [x, y];
}

// Minimap pins use the same combined list as the 3D labels.
const MINIMAP_PINS = ALL_PEAKS;

function drawMinimapPin(ctx, x, y) {
  ctx.beginPath();
  ctx.arc(x, y, 3.5, 0, Math.PI * 2);
  ctx.fillStyle = '#fff'; // neutral -- not tied to climbed/not-climbed status
  ctx.fill();
  ctx.lineWidth = 1.2;
  ctx.strokeStyle = '#000';
  ctx.stroke();
}

function updateMinimap(carto, headingDeg) {
  const ctx = minimapCtx;
  const w = minimapCanvas.width, h = minimapCanvas.height;
  const lonDeg = Cesium.Math.toDegrees(carto.longitude);
  const latDeg = Cesium.Math.toDegrees(carto.latitude);

  const zoom = settings.minimapZoom;
  const centerTileX = Math.floor(tileXFrac(lonDeg, zoom));
  const centerTileY = Math.floor(tileYFrac(latDeg, zoom));
  ensureMinimapTiles(centerTileX, centerTileY, zoom);

  const [playerPxX, playerPxY] = lonLatToMinimapPx(lonDeg, latDeg, zoom);
  const srcX = playerPxX - w / 2, srcY = playerPxY - h / 2;

  ctx.clearRect(0, 0, w, h);
  if (minimapBg) {
    ctx.drawImage(minimapBg, srcX, srcY, w, h, 0, 0, w, h);
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.15)'; // placeholder while tiles load
    ctx.fillRect(0, 0, w, h);
  }

  // Mountain pins for whatever falls inside the visible area. Every visible
  // peak gets a dot, but only the highest few get a text label -- at wide
  // zooms dozens are in frame at once and labelling them all just produces
  // an unreadable pile of overlapping text.
  const visible = [];
  for (const p of MINIMAP_PINS) {
    const [px, py] = lonLatToMinimapPx(p.lon, p.lat, zoom);
    const x = px - srcX, y = py - srcY;
    if (x < -10 || x > w + 10 || y < -10 || y > h + 10) continue;
    visible.push({ p, x, y });
    drawMinimapPin(ctx, x, y);
  }
  visible.sort((a, b) => b.p.elev - a.p.elev);
  // Dark text with a white halo, since OSM tiles are pale -- the previous
  // white-on-shadow treatment was tuned for the dark topo tiles and washed
  // out completely against roads and open ground.
  ctx.font = 'bold 9px sans-serif';
  ctx.textAlign = 'left';
  ctx.lineJoin = 'round';
  ctx.lineWidth = 3;
  ctx.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx.fillStyle = '#111';
  for (const v of visible.slice(0, 8)) {
    const t = `${v.p.name} ${v.p.elev}m`;
    ctx.strokeText(t, v.x + 6, v.y - 4);
    ctx.fillText(t, v.x + 6, v.y - 4);
  }

  // Current position + heading arrow, always centered (map pans, not the
  // marker). Drawn twice: a thicker black pass underneath, then the blue on
  // top, so the marker stays readable over pale OSM tiles as well as dark
  // forest green.
  const cx = w / 2, cy = h / 2;
  const headRad = Cesium.Math.toRadians(headingDeg);
  const tipX = cx + Math.sin(headRad) * 12, tipY = cy - Math.cos(headRad) * 12;

  ctx.lineCap = 'round';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 4.5;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(tipX, tipY);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.stroke();

  ctx.strokeStyle = '#4fc3f7';
  ctx.fillStyle = '#4fc3f7';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(tipX, tipY);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.lineCap = 'butt';
}
</script>
</body>
</html>
