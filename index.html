<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Peak Cruiser</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
<link href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
<style>
  html, body, #cesiumContainer { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; }
  /* Readouts and instruments bottom-left, minimap bottom-right: the whole
     upper view stays clear for the mountains and their labels. */
  #hud {
    position: absolute; bottom: 10px; left: 10px; z-index: 10;
    font-family: sans-serif; color: #fff; background: rgba(0,0,0,0.5);
    padding: 10px 12px; border-radius: 6px; font-size: 13px; line-height: 1.5;
  }
  /* Fixed width + tabular figures: without both, the panel breathed in and
     out as the coordinate readouts changed digits, which is very visible at
     the corner of the eye while flying. */
  #hudText { width: 250px; }
  #hud, #hudText { font-variant-numeric: tabular-nums; }
  #rawvals { display: block; white-space: nowrap; overflow: hidden; }
  #connectBtn { font-size: 1rem; padding: 0.4rem 1rem; cursor: pointer; margin-bottom: 6px; }
  .ok { color: #6f6; } .bad { color: #f66; }

  /* PeakFinder-style leader-line labels. The element is a zero-size anchor
     placed exactly on the summit's screen point; dot, line and text all
     position themselves off that origin. */
  /* Positioned with transform rather than left/top: moving a label then
     only touches compositing, not layout, which matters once 100+ of them
     are being repositioned every frame. */
  .peak-label {
    position: absolute; left: 0; top: 0; width: 0; height: 0; z-index: 5; pointer-events: none;
    font-family: sans-serif; color: #fff; text-shadow: 0 0 4px #000, 0 0 3px #000;
  }
  /* Slanted text, pivoting on the top of the leader line. Rotating the names
     is what lets them pack tightly: two labels only collide once the
     perpendicular gap between their parallel baselines closes, so peaks a
     couple of dozen pixels apart can both stay legible instead of one
     having to be dropped. */
  .peak-label .rot {
    position: absolute; left: 0; display: block; white-space: nowrap;
    transform-origin: 0 100%; transform: rotate(-45deg);
  }
  /* Every label leans the same way. Mirroring the ones near the right edge
     was tried and dropped: the two directions crossed over each other, and
     running off the side edge is harmless anyway. */
  /* All peaks are styled the same on the 3D view. Rank badges and colour
     were tried and dropped: they made the skyline read as a ranking rather
     than a landscape. Which list a peak belongs to is answered by the
     nearby-peaks panel, where there's room to say it plainly. */
  .peak-label .name { font-size: 13px; font-weight: bold; }
  .peak-label .dist { font-size: 10px; opacity: 0.85; margin-left: 4px; }
  .peak-label .line {
    position: absolute; left: 0; bottom: 0; width: 1px;
    background: rgba(255,255,255,0.8);
  }
  .peak-label .dot {
    position: absolute; left: -4px; bottom: -4px;
    width: 6px; height: 6px; border-radius: 50%; background: #fff;
    border: 1px solid rgba(0,0,0,0.75);
  }

  #settingsBtn {
    position: absolute; top: 10px; right: 10px; z-index: 10;
    font-size: 1rem; padding: 0.4rem 0.8rem; cursor: pointer;
  }
  #settingsPanel {
    position: absolute; top: 50px; right: 10px; z-index: 10;
    font-family: sans-serif; color: #fff; background: rgba(0,0,0,0.75);
    padding: 14px 16px; border-radius: 6px; font-size: 13px; width: 260px;
    display: none; max-height: calc(100vh - 70px); overflow-y: auto;
  }
  #settingsPanel.open { display: block; }
  #settingsPanel .row { margin-bottom: 12px; }
  #settingsPanel label { display: flex; justify-content: space-between; margin-bottom: 3px; }
  #settingsPanel input[type=range] { width: 100%; }
  #settingsPanel button.reset {
    width: 100%; padding: 5px; cursor: pointer; margin-top: 4px;
  }

  /* Compass bearings drawn on the horizon. Blue rather than white so they
     read as a separate layer from the peak names. */
  /* Anchored by its BOTTOM edge, so the marker stacks upward from the
     horizon point: the lower tick just touches the skyline and the text sits
     clear of the terrain, against the sky where it stays readable. */
  .sky-dir {
    position: absolute; transform: translate(-50%, -100%);
    display: flex; flex-direction: column; align-items: center;
    font-family: sans-serif; color: #6cc6ff; text-align: center;
    text-shadow: 0 0 4px #000, 0 0 3px #000; white-space: nowrap;
  }
  /* Three weights so the eye can find N/E/S/W instantly and read the rest
     as subdivisions between them. */
  .sky-dir .lbl { letter-spacing: 1px; line-height: 1.1; }
  .sky-dir.cardinal .lbl { font-size: 17px; font-weight: bold; }
  .sky-dir.inter .lbl { font-size: 13px; font-weight: bold; opacity: 0.92; }
  .sky-dir.minor .lbl { font-size: 10px; opacity: 0.7; }
  /* Short tick above the label, then a long stem running all the way down
     from the sky to the point on the horizon it marks. Fading the stem out
     toward the bottom keeps it from competing with the terrain silhouette
     and the peak leader lines it crosses. */
  .sky-dir .tick { width: 1px; background: rgba(108,198,255,0.9); }
  .sky-dir.cardinal .tick { height: 14px; }
  .sky-dir.inter .tick { height: 10px; }
  .sky-dir.minor .tick { height: 6px; opacity: 0.6; }
  .sky-dir .tick.top { margin-bottom: 3px; }
  .sky-dir .stem {
    width: 1px; flex: 1; margin-top: 3px; min-height: 0;
    background: linear-gradient(to bottom,
      rgba(108,198,255,0.85) 0%, rgba(108,198,255,0.45) 55%, rgba(108,198,255,0.12) 100%);
  }
  .sky-dir.minor .stem { opacity: 0.55; }

  #nearbyBtn {
    position: absolute; top: 10px; right: 96px; z-index: 10;
    font-size: 1rem; padding: 0.4rem 0.8rem; cursor: pointer;
  }
  #nearbyPanel {
    position: absolute; top: 50px; right: 10px; z-index: 10; display: none;
    font-family: sans-serif; color: #fff; background: rgba(0,0,0,0.75);
    padding: 10px 12px; border-radius: 6px; font-size: 12px; width: 290px;
    max-height: 70vh; overflow-y: auto;
  }
  #nearbyPanel.open { display: block; }
  #nearbyPanel table { border-collapse: collapse; width: 100%; }
  #nearbyPanel td { padding: 2px 4px; white-space: nowrap; }
  #nearbyPanel td.dir { color: #9ecbff; width: 2.6em; }
  #nearbyPanel td.km { text-align: right; color: #ddd; }
  #nearbyPanel td.el { text-align: right; color: #aaa; }
  #nearbyPanel tr.r100 td.nm { color: #ffd54f; }
  #nearbyPanel td.bdg { width: 1.2em; text-align: center; color: #ffd54f; }
  #nearbyPanel tr.r300 td.bdg { color: #888; }
  #nearbyPanel .vis { color: #8f8; }
  #nearbyPanel .legend {
    font-size: 11px; opacity: 0.8; line-height: 1.6;
    padding-bottom: 6px; margin-bottom: 6px;
    border-bottom: 1px solid rgba(255,255,255,0.2);
  }

  /* Startup gate: flying into a half-loaded world is disorienting, so hold
     the view until enough terrain and imagery has arrived to look like
     somewhere. Always skippable -- on a slow link the wait could be long. */
  #loading {
    position: absolute; inset: 0; z-index: 50;
    display: flex; align-items: center; justify-content: center;
    background: #8fc6ea; font-family: sans-serif; color: #fff;
    transition: opacity 0.5s ease; text-align: center;
  }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .box { background: rgba(0,0,0,0.45); padding: 28px 36px; border-radius: 10px; }
  #loading .ttl { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
  #loading .msg { font-size: 13px; opacity: 0.9; margin-bottom: 14px; }
  #loading .bar {
    width: 260px; height: 6px; border-radius: 3px;
    background: rgba(255,255,255,0.25); overflow: hidden;
  }
  #loading .fill {
    height: 100%; width: 0%; background: #fff;
    transition: width 0.3s ease;
  }
  #loading button {
    margin-top: 14px; font-size: 12px; padding: 5px 14px; cursor: pointer;
    background: rgba(255,255,255,0.15); color: #fff;
    border: 1px solid rgba(255,255,255,0.5); border-radius: 4px;
  }

  #minimap {
    position: absolute; bottom: 10px; right: 10px; z-index: 10; display: block;
    background: rgba(0,0,0,0.6);
    border-radius: 6px; border: 1px solid rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
<div id="cesiumContainer"></div>
<div id="loading">
  <div class="box">
    <div class="ttl">🏔 Peak Cruiser</div>
    <div class="msg" id="loadingMsg">地形を読み込んでいます…</div>
    <div class="bar"><div class="fill" id="loadingBar"></div></div>
    <button id="loadingSkip">待たずに開始</button>
  </div>
</div>
<div id="peakLabels" style="position:absolute; inset:0; z-index:5; pointer-events:none; overflow:hidden;"></div>
<div id="skyCompass" style="position:absolute; inset:0; z-index:4; pointer-events:none; overflow:hidden;"></div>
<button id="nearbyBtn">📋 近くの山</button>
<div id="nearbyPanel"><div id="nearbyList"></div></div>
<canvas id="minimap" width="240" height="240"></canvas>
<div id="hud">
  <div id="hudText">
    <div style="font-weight:bold; font-size:15px; margin-bottom:5px;">🏔 Peak Cruiser</div>
    <button id="connectBtn">SpaceMouseに接続</button><br>
    <span id="status">未接続</span><br>
    <span style="font-size:11px;opacity:0.85">入力: <span id="inputSources">キーボード</span></span><br>
    速度: <span id="speed">0.0</span> m/s<br>
    高度: <span id="alt">-</span> m<br>
    <span style="color:#ffd54f">FPS: <span id="fps">-</span> &nbsp; 画質: <span id="resScale">-</span></span><br>
    <span style="color:#ffd54f">地形: <span id="terrainSSE">-</span> &nbsp; 通信中: <span id="pendingTiles">-</span></span><br>
    <span style="font-size:11px">キャッシュ: <span id="cacheStatus">-</span></span><br>
    <span id="rawvals" style="font-size:11px;opacity:0.9">x=0 y=0 z=0 | rx=0 ry=0 rz=0</span>
    <div style="display:flex; gap:8px; margin-top:6px;">
      <canvas id="compass" width="80" height="80"></canvas>
      <canvas id="attitude" width="80" height="80"></canvas>
    </div>
  </div>
</div>

<button id="settingsBtn">⚙ 設定</button>
<div id="settingsPanel">
  <div class="row">
    <label><span>画質プリセット</span></label>
    <select id="s_preset" style="width:100%; padding:4px;">
      <option value="">— 選ぶと下の項目をまとめて設定 —</option>
      <option value="light">軽量 (PCの負荷を最小に)</option>
      <option value="standard">標準</option>
      <option value="high">高画質 (リアル優先)</option>
    </select>
  </div>
  <div class="row">
    <label style="justify-content:flex-start; gap:8px; cursor:pointer;">
      <input type="checkbox" id="c_skyAtmosphere" style="width:auto;">
      <span>リアルな空と大気</span>
    </label>
  </div>
  <div class="row">
    <label style="justify-content:flex-start; gap:8px; cursor:pointer;">
      <input type="checkbox" id="c_antiAlias" style="width:auto;">
      <span>輪郭のギザギザを消す (FXAA)</span>
    </label>
  </div>
  <div class="row">
    <label style="justify-content:flex-start; gap:8px; cursor:pointer;">
      <input type="checkbox" id="c_coarseWhileMoving" style="width:auto;">
      <span>移動中は地形を粗くして軽くする</span>
    </label>
  </div>
  <hr style="border:none; border-top:1px solid rgba(255,255,255,0.2); margin:12px 0 10px;">
  <div class="row">
    <label><span>ラベルを付ける山</span></label>
    <select id="s_peakSet" style="width:100%; padding:4px;">
      <option value="meizan">三百名山のみ (301座)</option>
      <option value="1500">＋標高1500m以上の山</option>
      <option value="1000">＋標高1000m以上の山</option>
      <option value="all">＋名前のある全ての山 (約1.3万座)</option>
    </select>
  </div>
  <div class="row">
    <label><span>ラベルの最大数</span><span id="v_maxLabels"></span></label>
    <input type="range" id="s_maxLabels" min="5" max="150" step="5">
  </div>
  <div class="row">
    <label><span>ラベルの間隔</span><span id="v_labelSpacing"></span></label>
    <input type="range" id="s_labelSpacing" min="12" max="60" step="2">
  </div>
  <div class="row">
    <label style="justify-content:flex-start; gap:8px; cursor:pointer;">
      <input type="checkbox" id="c_hideOccluded" style="width:auto;">
      <span>尾根に隠れた山は表示しない</span>
    </label>
  </div>
  <hr style="border:none; border-top:1px solid rgba(255,255,255,0.2); margin:12px 0 10px;">
  <div class="row">
    <label><span>基本速度 (最低速度)</span><span id="v_moveSpeed"></span></label>
    <input type="range" id="s_moveSpeed" min="10" max="50000" step="10">
  </div>
  <div class="row">
    <label><span>高度に比例した速さ</span><span id="v_relSpeed"></span></label>
    <input type="range" id="s_relSpeed" min="0.2" max="6" step="0.1">
  </div>
  <div class="row">
    <label><span>押し続けたときの加速</span><span id="v_cruiseBoost"></span></label>
    <input type="range" id="s_cruiseBoost" min="1" max="6" step="0.5">
  </div>
  <div class="row">
    <label><span>回転速度</span><span id="v_rotSpeed"></span></label>
    <input type="range" id="s_rotSpeed" min="0.1" max="8" step="0.05">
  </div>
  <div class="row">
    <label><span>不感帯(デッドゾーン)</span><span id="v_deadzone"></span></label>
    <input type="range" id="s_deadzone" min="0" max="0.5" step="0.01">
  </div>
  <div class="row">
    <label><span>画質上限(解像度)</span><span id="v_maxResolutionScale"></span></label>
    <input type="range" id="s_maxResolutionScale" min="0.15" max="1.0" step="0.05">
  </div>
  <div class="row">
    <label><span>画質下限(解像度)</span><span id="v_minResolutionScale"></span></label>
    <input type="range" id="s_minResolutionScale" min="0.1" max="1.0" step="0.02">
  </div>
  <div class="row">
    <label><span>ミニマップ拡大率</span><span id="v_minimapZoom"></span></label>
    <input type="range" id="s_minimapZoom" min="5" max="12" step="1">
  </div>
  <div class="row">
    <label><span>地形の細かさ(小さいほど高精細)</span><span id="v_terrainDetail"></span></label>
    <input type="range" id="s_terrainDetail" min="0.5" max="8" step="0.5">
  </div>
  <div class="row">
    <label><span>遠いラベルの濃さ</span><span id="v_labelFarOpacity"></span></label>
    <input type="range" id="s_labelFarOpacity" min="0" max="1" step="0.05">
  </div>
  <div class="row">
    <label style="justify-content:flex-start; gap:8px; cursor:pointer;">
      <input type="checkbox" id="c_japanOnly" style="width:auto;">
      <span>日本の範囲だけ描画</span>
    </label>
  </div>
  <hr style="border:none; border-top:1px solid rgba(255,255,255,0.2); margin:12px 0 10px;">
  <div class="row">
    <label><span>FPS上限</span><span id="v_fpsCap"></span></label>
    <input type="range" id="s_fpsCap" min="0" max="60" step="5">
  </div>
  <div class="row">
    <label><span>操作の慣性</span><span id="v_inputSmoothing"></span></label>
    <input type="range" id="s_inputSmoothing" min="0" max="0.4" step="0.01">
  </div>
  <div class="row">
    <label style="justify-content:flex-start; gap:8px; cursor:pointer;">
      <input type="checkbox" id="c_pauseWhenUnfocused" style="width:auto;">
      <span>非アクティブ時は停止</span>
    </label>
  </div>
  <div class="row">
    <label style="justify-content:flex-start; gap:8px; cursor:pointer;">
      <input type="checkbox" id="c_sunLighting" style="width:auto;">
      <span>太陽で陰影をつける(昼夜)</span>
    </label>
  </div>
  <div class="row">
    <label><span>地表テクスチャ</span></label>
    <select id="s_imagery" style="width:100%; padding:4px;"></select>
  </div>
  <div class="row">
    <label><span>遠景のかすみ</span><span id="v_fogDensity"></span></label>
    <input type="range" id="s_fogDensity" min="0" max="2" step="0.05">
  </div>
  <div class="row">
    <label><span>時刻 (JST)</span><span id="v_timeOfDay"></span></label>
    <input type="range" id="s_timeOfDay" min="0" max="24" step="0.25">
  </div>
  <button class="reset" id="resetBtn">初期値に戻す</button>
</div>

<script>
// No Cesium ion account needed: OpenStreetMap imagery. Real elevation comes
// from Esri's public ArcGIS World Elevation service (no token required,
// widely used in the Cesium community for exactly this).
Cesium.Ion.defaultAccessToken = undefined;

const viewer = new Cesium.Viewer('cesiumContainer', {
  baseLayer: new Cesium.ImageryLayer(
    new Cesium.OpenStreetMapImageryProvider({ url: 'https://tile.openstreetmap.org/' })
  ),
  baseLayerPicker: false,
  geocoder: false,
  homeButton: false,
  sceneModePicker: false,
  navigationHelpButton: false,
  animation: false,
  timeline: false,
  fullscreenButton: false,
  infoBox: false,
  selectionIndicator: false,
});
viewer.scene.globe.depthTestAgainstTerrain = true;
// Real (1:1) elevation reads as nearly flat from typical viewing distances
// -- even Fuji's ~3776m is subtle across tens of km of horizontal view.
// Exaggerating vertically makes the relief actually readable, matching the
// "shape-first, dramatic" look from the earlier Blender attempt.
viewer.scene.verticalExaggeration = 1.0; // real scale preferred over the dramatic look

// Only draw a frame when something actually changed: the camera moved, a tile
// arrived, or a setting asked for one (scene.requestRender()). Before v0.3
// Cesium redrew the whole globe at the frame cap even with the camera parked,
// which is where most of the idle GPU load came from. The render loop itself
// keeps running (cheaply), and tick() hangs off it, so input is still read.
viewer.scene.requestRenderMode = true;
viewer.scene.maximumRenderTimeChange = Infinity;

// Tiles kept in memory after they scroll out of view (default 100). Turning
// round to look back at where you just were then redraws from memory instead
// of re-downloading and re-decoding everything.
viewer.scene.globe.tileCacheSize = 400;

// ---- Selectable surface textures.
// Every option here is a plain raster tile layer whose shading is baked in
// server-side. That's deliberate: Cesium's real-time globe materials (the
// ElevationRamp/SlopeRamp family) blow past this GPU's 16 fragment texture
// units the moment they're combined with imagery, and SlopeRamp additionally
// needs vertex normals the ArcGIS terrain source doesn't provide. Fetching
// pre-shaded tiles sidesteps both problems entirely and costs one texture
// unit, same as any other imagery.
//
// The GSI (国土地理院) layers only cover Japan, which is fine -- the globe is
// clipped to Japan anyway.
const GSI = 'https://cyberjapandata.gsi.go.jp/xyz';
const GSI_CREDIT = '国土地理院';

// One entry per layer, freely combinable. Order here is bottom-to-top on the
// globe, so a base map sits under the shading and colour washes that
// modulate it. Each carries a default opacity suited to being stacked.
// A fixed set of looks, one at a time. Free-form stacking was tried and
// dropped: most combinations muddied each other, and the one that genuinely
// worked (elevation colour under a hillshade) is better shipped as a
// deliberate preset than left for the user to rediscover.
const IMAGERY_OPTIONS = [
  { id: 'opentopo', label: '地形図 (OpenTopoMap)', layers: [
    { url: 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
      subdomains: ['a','b','c'], credit: '© OpenTopoMap (CC-BY-SA)', maximumLevel: 16 } ] },
  // minimumLevel matters as much as maximumLevel here: each GSI layer only
  // exists over a specific zoom range, and without a floor Cesium happily
  // asks for z0-4 and collects a pile of 404s on every load.
  { id: 'relief', label: '色別標高図 (グラデーション)', layers: [
    { url: `${GSI}/relief/{z}/{x}/{y}.png`, credit: GSI_CREDIT, minimumLevel: 5, maximumLevel: 15 } ] },
  // The one combination worth keeping: elevation colour says "how high",
  // the hillshade over it says "what shape".
  { id: 'relief_shade', label: '色別標高図＋陰影 (おすすめ)', layers: [
    { url: `${GSI}/relief/{z}/{x}/{y}.png`, credit: GSI_CREDIT, minimumLevel: 5, maximumLevel: 15 },
    { url: `${GSI}/hillshademap/{z}/{x}/{y}.png`, credit: GSI_CREDIT, minimumLevel: 2, maximumLevel: 16, alpha: 0.55 } ] },
  { id: 'photo', label: '航空写真', layers: [
    { url: `${GSI}/seamlessphoto/{z}/{x}/{y}.jpg`, credit: GSI_CREDIT, minimumLevel: 2, maximumLevel: 18 } ] },
  { id: 'pale', label: '淡色地図', layers: [
    { url: `${GSI}/pale/{z}/{x}/{y}.png`, credit: GSI_CREDIT, minimumLevel: 2, maximumLevel: 18 } ] },
  { id: 'shade', label: '陰影起伏図のみ (白黒)', layers: [
    { url: `${GSI}/hillshademap/{z}/{x}/{y}.png`, credit: GSI_CREDIT, minimumLevel: 2, maximumLevel: 16 } ] },
  { id: 'std', label: '標準地図', layers: [
    { url: `${GSI}/std/{z}/{x}/{y}.png`, credit: GSI_CREDIT, minimumLevel: 2, maximumLevel: 18 } ] },
];

function applyImagery() {
  const opt = IMAGERY_OPTIONS.find(o => o.id === settings.imagery) || IMAGERY_OPTIONS[0];
  viewer.imageryLayers.removeAll();
  for (const spec of opt.layers) {
    const layer = viewer.imageryLayers.addImageryProvider(
      new Cesium.UrlTemplateImageryProvider(spec));
    if (spec.alpha !== undefined) layer.alpha = spec.alpha;
  }
  viewer.scene.requestRender();
}

viewer.scene.globe.material = undefined;
viewer.scene.globe.showWaterEffect = true;

// ---- Performance: this is a 2018 integrated GPU (Iris Plus 655), not a
// gaming card. Priority: keep VISIBLE terrain's detail/3D feel, cut
// everything else that doesn't directly serve that.
// Both of these are placeholders: the adaptive quality controller below
// takes over once settings load, and drives them from measured FPS.
viewer.scene.globe.maximumScreenSpaceError = 2;
viewer.resolutionScale = 0.65;
viewer.scene.postProcessStages.fxaa.enabled = false; // settings.antiAlias decides, see applyRealism()

viewer.scene.fog.enabled = true;                // wanted back for aerial-perspective depth cueing
viewer.scene.skyAtmosphere.show = false;        // settings.skyAtmosphere decides, see applyRealism()
// Ground atmosphere back ON, despite costing a little. It is what supplies
// the fog's COLOUR: with it off, Cesium blends distant terrain toward a dark
// unlit tone, which is why far ranges turned into a black band instead of
// receding into haze. Fog without atmosphere doesn't mean "no haze", it
// means "haze that is the wrong colour".
viewer.scene.globe.showGroundAtmosphere = true;
viewer.scene.skyBox.show = false;               // stars -- purely decorative, cut it
// Flat sky-blue instead of pure black now that the atmosphere/stars are off.
viewer.scene.backgroundColor = Cesium.Color.fromCssColorString('#8fc6ea');

// ---- Making distant ranges actually readable.
// Three separate things were conspiring to turn far-off mountains into one
// flat dark slab on the horizon:
//
// 1. fog.minimumBrightness (default 0.1) multiplies distant terrain down to
//    near-black. That's the dark band -- it isn't shadow or missing imagery,
//    it's the fog deliberately crushing the brightness.
viewer.scene.fog.minimumBrightness = 0.75;
// 2. fog.screenSpaceErrorFactor inflates the allowed terrain error with
//    distance, so far ridges collapse into a smooth silhouette with no
//    relief. Lower factor = distant terrain keeps its shape.
viewer.scene.fog.screenSpaceErrorFactor = 1.0;
// Haze strength, live-tunable. Cesium's default density (2.0e-4) is tuned
// for a whole-globe view and is far too thick for looking across a hundred
// km of mountains -- it buries exactly the distant ridges this app exists to
// show. Dropping it to 0 turns haze off entirely, which is also the quickest
// way to confirm whether fog is what's hiding a far peak.
const FOG_DENSITY_BASE = 2.0e-4;
function applyFog() {
  viewer.scene.fog.enabled = settings.fogDensity > 0;
  viewer.scene.fog.density = FOG_DENSITY_BASE * settings.fogDensity;
  viewer.scene.requestRender();
}

// 3. With no imagery loaded that far out, whatever shows through is
//    globe.baseColor -- dark by default. A pale haze tone means the worst
//    case is "washed out and far away" rather than "black wall".
viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString('#b8d4e6');

// Skip sibling tiles (pure waste for a forward-facing camera), but DO keep
// ancestors: they're few, cheap and low-res, and they're the fallback that
// gets drawn while a distant tile is still loading. Without them the far
// horizon falls back to baseColor and flickers as tiles arrive.
viewer.scene.globe.preloadSiblings = false;
viewer.scene.globe.preloadAncestors = true;

// The "looks real" switches. A gradient sky with atmospheric scattering
// reads far more like being in the mountains than a flat blue backdrop, and
// costs one extra pass over the sky pixels only. FXAA is a full-screen pass,
// so it stays off unless asked for.
function applyRealism() {
  viewer.scene.skyAtmosphere.show = settings.skyAtmosphere;
  viewer.scene.postProcessStages.fxaa.enabled = settings.antiAlias;
  viewer.scene.requestRender();
}

Cesium.ArcGISTiledElevationTerrainProvider.fromUrl(
  'https://elevation3d.arcgis.com/arcgis/rest/services/WorldElevation3D/Terrain3D/ImageServer',
  { requestVertexNormals: true } // needed for slope/aspect-based materials (SlopeRamp etc.) to work at all
).then(terrainProvider => {
  viewer.terrainProvider = terrainProvider;
}).catch(err => {
  console.error('terrain load failed, staying flat:', err);
});

// NOTE: we do NOT disable Cesium's screenSpaceCameraController here.
// Setting enableRotate/enableZoom/etc. to false turned out to break Cesium's
// internal tile-loading/LOD logic entirely (confirmed by testing: with the
// controller disabled, imagery never rendered -- a solid black/navy screen
// at any close-up altitude, even though tiles fetch fine and the globe
// itself was present). Leaving the controller enabled but simply never
// generating mouse/touch events (all navigation drives from the SpaceMouse,
// which updates the camera directly every frame in tick() below) achieves
// the same unconstrained free-flight feel without breaking rendering.

// Start above Mt. Fuji.
viewer.camera.setView({
  destination: Cesium.Cartesian3.fromDegrees(138.7274, 35.3606, 8000),
  orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45), roll: 0 }
});
// Cesium quirk (confirmed by extensive testing): a fresh Viewer whose very
// first view is already a close-up zoom gets its imagery tile pipeline
// permanently stuck -- solid black/navy, zero tile requests ever made for
// that view, as if it needs to build its tile quadtree starting from a
// coarser zoom. flyHome()/flyTo() sometimes avoided it, setView() alone
// never did, and neither was reliable enough to depend on. Toggling
// globe.show off and back on forces Cesium to rebuild the quadtree from
// scratch at the CURRENT camera position and reliably un-sticks it.
viewer.scene.globe.show = false;
viewer.scene.requestRender();
setTimeout(() => {
  viewer.scene.globe.show = true;
  viewer.scene.requestRender();
}, 100);

// Labels come from the 301 famous mountains only. Personally-climbed peaks
// that aren't on any list (御在所岳) are deliberately NOT added -- PEAKS is
// kept above purely as the record of what's been climbed, for future use.
const EARTH_R = 6371000;
// How far away a peak of height `h` can still poke above the horizon, and
// symmetrically how far the camera at height `h` can see. Without this,
// labels for mountains on the far side of the country float in the sky --
// mathematically in front of the camera, but hidden by the earth's bulge.
function horizonDistance(h) {
  return Math.sqrt(Math.max(0, 2 * EARTH_R * h + h * h));
}

const peakLabelsEl = document.getElementById('peakLabels');
function makePeakEntry(p) {
  const pos = Cesium.Cartesian3.fromDegrees(p.lon, p.lat, p.elev);
  return {
    ...p,
    pos,
    horizon: horizonDistance(p.elev),
    el: null,        // lazily-created DOM element
    occluded: false, // behind a ridge, as of the last line-of-sight test
    occlAt: null,    // camera position that test was made from
    occlEpoch: -1,
  };
}
const meizanEntries = MEIZAN.map(makePeakEntry);

// ---- Which peaks get labels (v0.3).
// The 301 famous mountains on their own leave most views with only a handful
// of names. peaks-jp.json adds ~12,600 more named summits from OpenStreetMap
// (with elevation, minus the ones already in MEIZAN); it's only fetched once
// one of the larger sets is picked. Famous peaks always win a crowded spot:
// OSM peaks carry rank 400, below 三百名山.
let peakEntries = meizanEntries;
let minimapDirty = true;
// Positions as flat numbers, so the per-frame pre-filter over thousands of
// peaks is a tight loop over a typed array rather than object property
// lookups and Cartesian3 allocations.
let peakXYZ = new Float64Array(0);
function rebuildPeakXYZ() {
  peakXYZ = new Float64Array(peakEntries.length * 3);
  peakEntries.forEach((p, i) => {
    peakXYZ[i * 3] = p.pos.x; peakXYZ[i * 3 + 1] = p.pos.y; peakXYZ[i * 3 + 2] = p.pos.z;
  });
}
rebuildPeakXYZ();

let osmEntriesPromise = null;
function loadOsmEntries() {
  if (!osmEntriesPromise) {
    osmEntriesPromise = fetch('peaks-jp.json')
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(rows => rows.map(([name, lon, lat, elev]) => makePeakEntry({ name, lon, lat, elev, rank: 400 })))
      .catch(e => { osmEntriesPromise = null; throw e; });
  }
  return osmEntriesPromise;
}

let peakSetToken = 0;
let osmCreditAdded = false;
async function applyPeakSet() {
  const token = ++peakSetToken;
  let next = meizanEntries;
  if (settings.peakSet !== 'meizan') {
    try {
      const osm = await loadOsmEntries();
      const minElev = settings.peakSet === 'all' ? -Infinity : Number(settings.peakSet);
      next = meizanEntries.concat(osm.filter(p => p.elev >= minElev));
    } catch (e) {
      // Opened straight from disk (file://) the fetch is refused. Fall back
      // to the famous mountains rather than showing nothing.
      console.warn('peaks-jp.json could not be loaded:', e);
    }
  }
  if (token !== peakSetToken) return; // a newer choice arrived meanwhile
  const keep = new Set(next);
  for (const p of peakEntries) if (!keep.has(p) && p.el) p.el.style.display = 'none';
  if (next !== meizanEntries && !osmCreditAdded) {
    // ODbL asks for the attribution wherever the data is shown.
    viewer.creditDisplay.addStaticCredit(new Cesium.Credit('山データ © OpenStreetMap contributors'));
    osmCreditAdded = true;
  }
  peakEntries = next;
  rebuildPeakXYZ();
  labelsOnScreen = labelsOnScreen.filter(p => keep.has(p));
  overlayDirty = true;
  minimapDirty = true;
  wake();
}
// All labels share one text row, so the names line up instead of bobbing
// with each summit's height. The row isn't a fixed screen position though:
// it's placed just above whichever visible peak sits highest in frame, so it
// hugs the skyline rather than pinning to the top of the window and leaving
// every label on a leader line hundreds of pixels long.
const LABEL_OFFSET = 52;   // gap from the highest visible summit up to the row
const LABEL_MIN_Y = 26;    // never put the row above this (text would leave frame)
const LABEL_MIN_LINE = 8;  // keep a stub of leader line even when cramped
// With every label on one row, the 45-degree baselines are all offset purely
// by x, so plain horizontal spacing is what keeps the slanted names apart:
// a dx gap leaves dx/sqrt(2) of perpendicular clearance between them.
// settings.labelSpacing is that dx; the default 26px leaves ~18px of
// perpendicular clearance at 45 degrees.
// Estimating the rendered width of a label without measuring it. Reading
// offsetWidth would force a layout for every label on every frame, so this
// approximates instead: CJK glyphs are full-width at the 13px name font,
// latin/digits in the smaller distance suffix are roughly half that.
const LABEL_CJK_W = 14;
const LABEL_DIST_W = 95;   // " 123.4 km / 3776 m" at 10px
const LABEL_TEXT_H = 18;   // line height of the text block
const LABEL_PAD = 8;       // slack, since the width above is only an estimate
// How far a 45-degree label climbs above its pivot. Rotating a W x H box by
// 45 degrees lifts its far corner by (W + H)/sqrt(2) -- the height term is
// easy to forget and is worth roughly another 13px.
function labelTopExtent(peak) {
  const w = peak.name.length * LABEL_CJK_W + LABEL_DIST_W;
  return (w + LABEL_TEXT_H) * Math.SQRT1_2 + LABEL_PAD;
}
// Distance fade: near peaks read at full strength, far ones recede. Costs a
// single style write per label, and doubles as aerial perspective for the
// text -- the labels sit in the same depth as the haze behind them instead
// of all shouting equally loud.
const LABEL_FADE_NEAR = 15000;   // m: full opacity at or below this
const LABEL_FADE_FAR = 130000;   // m: fully faded to settings.labelFarOpacity

// ---- Compass bearings written on the horizon.
// Each marker is a real world position: a point on the ellipsoid at the
// horizon distance along that bearing. Projecting it the same way peaks are
// projected means the markers sit correctly on the skyline and respond to
// pitch and roll for free, rather than being faked from the yaw angle.
// 16 points rather than 8: the camera's horizontal field of view is only
// about 60 degrees, so 45-degree spacing frequently left a single marker (or
// none) on screen. At 22.5 degrees there are always two or three in view,
// which is what makes them read as a scale rather than a lone signpost.
const COMPASS_LABELS = ['N','NNE','NE','ENE','E','ESE','SE','SSE',
                        'S','SSW','SW','WSW','W','WNW','NW','NNW'];
const COMPASS_DIRS = COMPASS_LABELS.map((label, i) => ({
  deg: i * 22.5,
  label,
  tier: i % 4 === 0 ? 'cardinal' : (i % 2 === 0 ? 'inter' : 'minor'),
}));
const SKY_DIR_TOP = 30;    // px from the top of the frame to the label
const SKY_DIR_MIN_H = 34;  // never collapse the stem to nothing
const skyCompassEl = document.getElementById('skyCompass');
for (const d of COMPASS_DIRS) {
  const el = document.createElement('div');
  el.className = 'sky-dir ' + d.tier;
  el.innerHTML = `<div class="tick top"></div><div class="lbl">${d.label}</div>`
    + `<div class="stem"></div>`;
  skyCompassEl.appendChild(el);
  d.el = el;
}

// Destination point given a start, a bearing and a great-circle distance.
function destinationPoint(latDeg, lonDeg, bearingDeg, distM) {
  const R = EARTH_R;
  const d = distM / R;
  const br = Cesium.Math.toRadians(bearingDeg);
  const lat1 = Cesium.Math.toRadians(latDeg), lon1 = Cesium.Math.toRadians(lonDeg);
  const lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(br));
  const lon2 = lon1 + Math.atan2(Math.sin(br) * Math.sin(d) * Math.cos(lat1),
                                 Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));
  return [Cesium.Math.toDegrees(lon2), Cesium.Math.toDegrees(lat2)];
}

// NOTE: no terrain-occlusion test here, deliberately.
//
// These markers used to be raycast like the peak labels, and it hid every
// single one of them. The marker point sits at ellipsoid height 0 -- sea
// level -- while Japan's land surface is well above that, so a ray aimed at
// it always struck terrain first and every bearing was scored as "blocked".
// It only looked fine in testing because terrain wasn't loaded there and
// globe.pick returned nothing.
//
// It isn't needed anyway: the label now hangs near the top of the frame
// against open sky, and a bearing is worth knowing even when a mountain
// stands in that direction. Dropping the raycast also takes real work back
// off the frame budget.
function updateSkyCompass(carto) {
  const cw = viewer.canvas.clientWidth, ch = viewer.canvas.clientHeight;
  const camPos = viewer.camera.positionWC;
  const forward = viewer.camera.directionWC;
  const latDeg = Cesium.Math.toDegrees(carto.latitude);
  const lonDeg = Cesium.Math.toDegrees(carto.longitude);
  // Put the markers out at the horizon so they read as "that way", not as a
  // nearby object; clamped so they stay sane at very low altitude.
  const dist = Cesium.Math.clamp(horizonDistance(Math.max(0, carto.height)), 20000, 400000);
  const headingDeg = ((Cesium.Math.toDegrees(yaw) % 360) + 360) % 360;

  for (const d of COMPASS_DIRS) {
    // Cheap bearing test first. The camera sees about 60 degrees, so
    // anything more than 50 off the heading cannot be on screen -- skipping
    // those here avoids a great-circle solve and a matrix projection for
    // roughly three quarters of the markers, every frame.
    let delta = ((d.deg - headingDeg + 540) % 360) - 180;
    if (Math.abs(delta) > 50) { d.el.style.display = 'none'; continue; }

    const [lon2, lat2] = destinationPoint(latDeg, lonDeg, d.deg, dist);
    const pos = Cesium.Cartesian3.fromDegrees(lon2, lat2, 0);
    const to = Cesium.Cartesian3.subtract(pos, camPos, new Cesium.Cartesian3());
    Cesium.Cartesian3.normalize(to, to);
    if (Cesium.Cartesian3.dot(to, forward) <= 0) { d.el.style.display = 'none'; continue; }
    const win = Cesium.SceneTransforms.worldToWindowCoordinates(viewer.scene, pos);
    if (!win || win.x < 0 || win.x > cw) { d.el.style.display = 'none'; continue; }

    // Pitch down far enough and the horizon leaves the top of the frame.
    // Rejecting the marker there meant losing all sense of direction exactly
    // when looking straight at the ground -- which is most of the time in
    // this app. Clamp the anchor into view instead: the bearing stays
    // readable, it just stops claiming to sit on a horizon you can't see.
    const anchorY = Cesium.Math.clamp(win.y, SKY_DIR_TOP + SKY_DIR_MIN_H, ch);

    d.el.style.display = '';
    d.el.style.left = win.x + 'px';
    d.el.style.top = anchorY + 'px';
    // Bottom-anchored on that point, tall enough to lift the label up near
    // the top of the frame, so the name reads against open sky and the stem
    // shows which direction it refers to.
    d.el.style.height = Math.max(SKY_DIR_MIN_H, anchorY - SKY_DIR_TOP) + 'px';
  }
}

// ---- "Nearby peaks" list. Straight distance ranking from where you are,
// with the compass bearing, so it doubles as "what am I looking at over
// there". Recomputed on a timer rather than per frame -- 300 distance
// calculations are cheap but there's no reason to redo them 60x a second.
const COMPASS_16 = ['北','北北東','北東','東北東','東','東南東','南東','南南東',
                    '南','南南西','南西','西南西','西','西北西','北西','北北西'];
function bearingDeg(lat1, lon1, lat2, lon2) {
  const p1 = Cesium.Math.toRadians(lat1), p2 = Cesium.Math.toRadians(lat2);
  const dl = Cesium.Math.toRadians(lon2 - lon1);
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return (Cesium.Math.toDegrees(Math.atan2(y, x)) + 360) % 360;
}

// One glyph per list, for the nearby panel. Deliberately NOT used on the 3D
// labels -- badges and colour there turned the skyline into a ranking.
const RANK_BADGE = { 100: '★', 200: '☆', 300: '·', 400: '' };

const nearbyPanel = document.getElementById('nearbyPanel');
const nearbyListEl = document.getElementById('nearbyList');
function toggleNearby() {
  nearbyPanel.classList.toggle('open');
  if (nearbyPanel.classList.contains('open')) updateNearbyList();
}
document.getElementById('nearbyBtn').addEventListener('click', toggleNearby);

function updateNearbyList() {
  if (!nearbyPanel.classList.contains('open')) return; // hidden: don't bother
  const camPos = viewer.camera.positionWC;
  const carto = Cesium.Cartographic.fromCartesian(camPos);
  const latDeg = Cesium.Math.toDegrees(carto.latitude);
  const lonDeg = Cesium.Math.toDegrees(carto.longitude);

  // Up to ~13,000 peaks: measure on the flat array, keep a running top 25,
  // and only build row objects for those.
  const rows = [];
  const cx = camPos.x, cy = camPos.y, cz = camPos.z;
  for (let i = 0; i < peakEntries.length; i++) {
    const dx = peakXYZ[i * 3] - cx, dy = peakXYZ[i * 3 + 1] - cy, dz = peakXYZ[i * 3 + 2] - cz;
    const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
    if (rows.length === 25 && d >= rows[24].d) continue;
    rows.push({ p: peakEntries[i], d });
    rows.sort((a, b) => a.d - b.d);
    if (rows.length > 25) rows.pop();
  }

  const html = ['<div class="legend">' +
    `${RANK_BADGE[100]}百名山 ${RANK_BADGE[200]}二百名山 ${RANK_BADGE[300]}三百名山 無印=その他` +
    ' &nbsp;<span class="vis">●</span>いま見えている</div>', '<table>'];
  for (const { p, d } of rows) {
    const b = bearingDeg(latDeg, lonDeg, p.lat, p.lon);
    const dir = COMPASS_16[Math.round(b / 22.5) % 16];
    const visible = p.el && p.el.style.display !== 'none';
    html.push(
      `<tr class="r${p.rank}">` +
      `<td class="bdg">${RANK_BADGE[p.rank]}</td>` +
      `<td class="dir">${dir}</td>` +
      `<td class="nm">${p.name}${visible ? ' <span class="vis">●</span>' : ''}</td>` +
      `<td class="km">${(d / 1000).toFixed(1)}km</td>` +
      `<td class="el">${p.elev}m</td></tr>`);
  }
  html.push('</table>');
  nearbyListEl.innerHTML = html.join('');
}
setInterval(updateNearbyList, 700);

// ---- Ridge occlusion (v0.3), on our own coarse elevation grid.
// Raycasting Cesium's terrain mesh for this was by far the most expensive
// thing the app ever did, and was dropped in v0.2. This does the same job
// without touching the renderer: GSI's elevation tiles (dem_png, z9, about
// 300m a pixel) are decoded into plain Float32Arrays, and a line of sight is
// a few hundred array reads -- tens of microseconds per peak. It runs off a
// timer with a small time budget, so it can never hold up a frame.
const DEM_NA = 8388608;          // 2^23: "no data" (sea)
// Two grids: a coarse one (z9, ~300m) wide enough for lines of sight across
// a whole mountain range, and a fine one (z12, ~38m) that only ever needs
// the few tiles under the camera, for "how high am I above the ground".
function makeDemCache(z, maxTiles) {
  return { z, maxTiles, tiles: new Map(), loading: 0 };
}
const demCoarse = makeDemCache(9, Infinity);
const demFine = makeDemCache(12, 16);
let demEpoch = 0;                // bumped whenever a coarse tile arrives
function demTile(cache, tx, ty) {
  const key = tx + '/' + ty;
  const t = cache.tiles.get(key);
  if (t !== undefined) return t;
  if (cache.loading >= 4) return 'loading';
  // The fine cache follows the camera around; drop the oldest finished tile
  // (Map keeps insertion order) rather than letting it grow without limit.
  if (cache.tiles.size >= cache.maxTiles) {
    for (const [k, v] of cache.tiles) {
      if (v !== 'loading') { cache.tiles.delete(k); break; }
    }
  }
  cache.tiles.set(key, 'loading');
  cache.loading++;
  fetch(`${GSI}/dem_png/${cache.z}/${tx}/${ty}.png`)
    .then(r => {
      if (r.status === 404) return null; // outside Japan's coverage: open sea
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.blob();
    })
    .then(async blob => {
      if (!blob) { cache.tiles.set(key, 'sea'); return; }
      // No colour management: the RGB values ARE the elevation.
      const bmp = await createImageBitmap(blob, { colorSpaceConversion: 'none', premultiplyAlpha: 'none' });
      const cv = new OffscreenCanvas(256, 256);
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(bmp, 0, 0);
      const px = ctx.getImageData(0, 0, 256, 256).data;
      const h = new Float32Array(256 * 256);
      for (let i = 0; i < h.length; i++) {
        const v = (px[i * 4] << 16) | (px[i * 4 + 1] << 8) | px[i * 4 + 2];
        h[i] = v === DEM_NA ? 0 : (v < DEM_NA ? v : v - 2 * DEM_NA) * 0.01;
      }
      cache.tiles.set(key, h);
    })
    .catch(() => cache.tiles.delete(key)) // transient failure: retry later
    .finally(() => { cache.loading--; if (cache === demCoarse) demEpoch++; });
  return 'loading';
}
// Ground height in metres, 0 for sea, null while the tile is still on its way.
function demSample(cache, lon, lat) {
  const n = 1 << cache.z;
  const fx = (lon + 180) / 360 * n;
  const fy = tileYFrac(lat, cache.z);
  const tx = Math.floor(fx), ty = Math.floor(fy);
  const t = demTile(cache, tx, ty);
  if (t === 'loading') return null;
  if (t === 'sea') return 0;
  const px = Math.min(255, Math.floor((fx - tx) * 256));
  const py = Math.min(255, Math.floor((fy - ty) * 256));
  return t[py * 256 + px];
}
function demHeight(lon, lat) { return demSample(demCoarse, lon, lat); }
function groundHeight(lon, lat) {
  const h = demSample(demFine, lon, lat);
  return h !== null ? h : demSample(demCoarse, lon, lat);
}

// ---- v0.3.1: the single biggest CPU cost in the app, removed.
// Cesium answers globe.getHeight() by ray-testing the loaded terrain mesh,
// and ArcGIS's tiles are dense: measured at ~35ms a call (up to 63ms) on
// this machine. Cesium calls it itself at least twice per moving frame --
// the camera collision check and the scene's own camera-height bookkeeping
// -- so flying held the main thread for 70ms+ a frame, the framerate sank
// to 2-3fps, and the quality controller then wrecked the resolution trying
// to fix a problem that was never the GPU's.
//
// Collision detection is for Cesium's mouse controller, which this app
// doesn't fly with; the ground floor is enforced in tick() instead. The
// remaining callers get the answer from the GSI elevation grid, which is
// an array read.
viewer.scene.screenSpaceCameraController.enableCollisionDetection = false;
viewer.scene.globe.getHeight = function (cartographic) {
  const h = groundHeight(Cesium.Math.toDegrees(cartographic.longitude),
                         Cesium.Math.toDegrees(cartographic.latitude));
  return h === null ? undefined : h;
};

// Does the ground anywhere between the camera and the summit rise above the
// straight line joining them? Earth curvature is included: along a chord of
// length d the surface bulges up by f(1-f)d^2/2R. Returns null when part of
// the path has no elevation data yet, so the answer can be retried.
const OCCL_MARGIN = 20;          // m of slack for the coarse grid
function ridgeBlocks(peak, camLon, camLat, camH, dist) {
  const steps = Math.min(600, Math.max(16, Math.ceil(dist / 250)));
  // Stop short of the summit itself: its own shoulders, smeared by a 300m
  // grid, would otherwise count as "in the way".
  const stopAt = 1 - Math.min(0.5, 400 / dist);
  const k = dist * dist / (2 * EARTH_R);
  let incomplete = false;
  for (let i = 1; i < steps; i++) {
    const f = i / steps;
    if (f > stopAt) break;
    const g = demHeight(camLon + (peak.lon - camLon) * f, camLat + (peak.lat - camLat) * f);
    if (g === null) { incomplete = true; continue; }
    const lineH = camH + (peak.elev - camH) * f - f * (1 - f) * k;
    if (g > lineH + OCCL_MARGIN) return true;
  }
  return incomplete ? null : false;
}

// Filled in by updatePeakLabels: on-screen candidates in priority order.
let occlCandidates = [];
const OCCL_BUDGET_MS = 5;
let occlLastEpoch = -1;
setInterval(() => {
  if (!settings.hideOccluded || !windowFocused || occlCandidates.length === 0) return;
  // Asleep, the camera can't have moved: only new elevation data can change
  // an answer, so don't even wake the thread to check otherwise.
  if (sleeping && demEpoch === occlLastEpoch) return;
  occlLastEpoch = demEpoch;
  const t0 = performance.now();
  const camPos = viewer.camera.positionWC;
  const carto = Cesium.Cartographic.fromCartesian(camPos);
  const camLon = Cesium.Math.toDegrees(carto.longitude);
  const camLat = Cesium.Math.toDegrees(carto.latitude);
  let changed = false;
  for (const c of occlCandidates) {
    if (performance.now() - t0 > OCCL_BUDGET_MS) break;
    const p = c.peak;
    // Occlusion only depends on where the camera IS, not where it looks, and
    // changes slowly with distance -- so a result stays good until the camera
    // has moved a small fraction of the way to the peak.
    const moved = p.occlAt ? Cesium.Cartesian3.distance(camPos, p.occlAt) : Infinity;
    if (p.occlEpoch === demEpoch && moved < Math.max(30, c.distance * 0.005)) continue;
    const r = ridgeBlocks(p, camLon, camLat, carto.height, c.distance);
    p.occlAt = Cesium.Cartesian3.clone(camPos, p.occlAt || new Cesium.Cartesian3());
    p.occlEpoch = r === null ? -1 : demEpoch;
    const occ = r === true;
    if (occ !== p.occluded) { p.occluded = occ; changed = true; }
  }
  if (changed) { overlayDirty = true; wake(); }
}, 80);

// Cosine of the half-angle of a cone that contains the whole frustum, with a
// margin so a label whose anchor is just off-screen (but whose slanted text
// still reaches into view) isn't dropped. Recomputed on resize, since the
// horizontal extent depends on the aspect ratio.
let viewConeCos = -1;
function updateViewCone() {
  const f = viewer.camera.frustum;
  const fov = f.fov || Cesium.Math.toRadians(60);
  const aspect = f.aspectRatio || (viewer.canvas.clientWidth / Math.max(1, viewer.canvas.clientHeight));
  // Cesium applies `fov` to whichever screen dimension is larger.
  const tanX = aspect >= 1 ? Math.tan(fov / 2) : Math.tan(fov / 2) * aspect;
  const tanY = aspect >= 1 ? Math.tan(fov / 2) / aspect : Math.tan(fov / 2);
  const halfDiagonal = Math.atan(Math.hypot(tanX, tanY));
  viewConeCos = Math.cos(Math.min(Math.PI / 2, halfDiagonal + Cesium.Math.toRadians(8)));
}
updateViewCone();
window.addEventListener('resize', updateViewCone);

// Above this the view is essentially "Japan from space": every peak is a
// dot, the labels are meaningless clutter, and drawing them is pure cost.
const LABEL_MAX_CAMERA_HEIGHT = 500000;
// Never project more than this many candidates in one frame. With ~13,000
// peaks loaded a high view can have thousands in the cone; they're taken in
// priority order, so the ones skipped could never have won a slot anyway.
const LABEL_MAX_PROJECT = 3000;

let labelsOnScreen = [];          // peaks whose label is currently displayed
const scratchVP = new Cesium.Matrix4();

function updatePeakLabels() {
  const canvas = viewer.canvas;
  const cw = canvas.clientWidth, ch = canvas.clientHeight;
  const camPos = viewer.camera.positionWC;
  const camCarto = Cesium.Cartographic.fromCartesian(camPos);
  if (camCarto.height > LABEL_MAX_CAMERA_HEIGHT) {
    for (const peak of labelsOnScreen) peak.el.style.display = 'none';
    labelsOnScreen = [];
    occlCandidates = [];
    return;
  }
  const camHorizon = horizonDistance(Math.max(0, camCarto.height));
  const forward = viewer.camera.directionWC;
  const cx = camPos.x, cy = camPos.y, cz = camPos.z;
  const fx = forward.x, fy = forward.y, fz = forward.z;
  // World -> screen, done by hand with one view-projection matrix built per
  // frame. SceneTransforms.worldToWindowCoordinates costs ~2.4us a call
  // (scene-mode checks, drawing-buffer conversions); this is a dozen
  // multiplies, which is what makes thousands of candidates affordable.
  const m = Cesium.Matrix4.multiply(
    viewer.camera.frustum.projectionMatrix, viewer.camera.viewMatrix, scratchVP);

  // Pass 1, pure arithmetic: over the earth's curve? outside the view cone?
  // Comparing against the frustum's own half-angle (not just "in front")
  // throws away most peaks before any projection is paid for.
  const inCone = [];
  for (let i = 0; i < peakEntries.length; i++) {
    const dx = peakXYZ[i * 3] - cx, dy = peakXYZ[i * 3 + 1] - cy, dz = peakXYZ[i * 3 + 2] - cz;
    const distance = Math.sqrt(dx * dx + dy * dy + dz * dz);
    const peak = peakEntries[i];
    if (distance > camHorizon + peak.horizon) continue;
    if ((dx * fx + dy * fy + dz * fz) / distance <= viewConeCos) continue;
    inCone.push({ peak, distance, x: 0, y: 0 });
  }

  // Greedy placement by fame first: when two names would collide, the more
  // celebrated peak keeps its label -- 百名山, 二百名山, 三百名山, then the
  // rest. Distance only breaks ties within the same list, where the nearer
  // summit wins because it's the one you can actually pick out.
  inCone.sort((a, b) => a.peak.rank - b.peak.rank || a.distance - b.distance);

  const maxLabels = settings.maxLabels;
  const minDx = settings.labelSpacing;
  const hideOccluded = settings.hideOccluded;
  const shown = [];
  const occl = [];
  let projected = 0;
  for (const cand of inCone) {
    if (shown.length >= maxLabels || projected >= LABEL_MAX_PROJECT) break;
    projected++;
    const P = cand.peak.pos;
    const w = m[3] * P.x + m[7] * P.y + m[11] * P.z + m[15];
    if (w <= 0) continue;
    const sx = ((m[0] * P.x + m[4] * P.y + m[8] * P.z + m[12]) / w + 1) * 0.5 * cw;
    const sy = (1 - (m[1] * P.x + m[5] * P.y + m[9] * P.z + m[13]) / w) * 0.5 * ch;
    if (sx < 0 || sx > cw || sy < 0 || sy > ch) continue;
    cand.x = sx; cand.y = sy;
    // Every on-screen contender goes to the occlusion checker, hidden or
    // not, so a peak that comes back into view is noticed.
    if (occl.length < maxLabels * 4) occl.push(cand);
    if (hideOccluded && cand.peak.occluded) continue;
    if (shown.some(s => Math.abs(s.x - cand.x) < minDx)) continue;
    shown.push(cand);
  }
  occlCandidates = occl;

  // One shared row for every label, sitting just above the highest peak
  // that's actually on screen.
  let rowY = LABEL_MIN_Y;
  if (shown.length) {
    let highest = Infinity;
    for (const s of shown) if (s.y < highest) highest = s.y;
    rowY = Math.max(LABEL_MIN_Y, highest - LABEL_OFFSET);
  }

  // Push the row down far enough that the tallest diagonal still fits under
  // the top edge. Lowering the row only shortens leader lines, so this costs
  // nothing visually and saves labels that would otherwise have to be culled.
  let maxTop = 0;
  for (const s of shown) {
    const t = labelTopExtent(s.peak);
    if (t > maxTop) maxTop = t;
  }
  rowY = Math.max(rowY, maxTop);

  // Only the TOP edge is enforced. Running past the left or right edge is
  // fine -- the name stays readable and the peak keeps its label -- whereas
  // a label that climbs out of the top takes its text off screen entirely
  // and leaves an orphaned leader line pointing at nothing.
  //
  // The pivot is NOT always on the row: a peak sitting above the row keeps
  // only a stub of leader line, so its text starts just above the summit.
  for (let i = shown.length - 1; i >= 0; i--) {
    const s = shown[i];
    const pivotY = Math.min(rowY, s.y - LABEL_MIN_LINE);
    if (pivotY - labelTopExtent(s.peak) < 0) shown.splice(i, 1);
  }

  // Hide only what was showing last frame and isn't now -- not a sweep over
  // every peak, which with the large sets would be 13,000 checks a frame.
  const shownSet = new Set(shown.map(c => c.peak));
  for (const peak of labelsOnScreen) {
    if (!shownSet.has(peak)) peak.el.style.display = 'none';
  }
  labelsOnScreen = shown.map(c => c.peak);

  for (const { peak, x, y, distance } of shown) {
    if (!peak.el) {
      const el = document.createElement('div');
      el.className = 'peak-label';
      el.innerHTML = `<span class="rot"><span class="name"></span><span class="dist"></span></span>`
        + `<span class="line"></span><span class="dot"></span>`;
      peakLabelsEl.appendChild(el);
      peak.el = el;
      // Cache the child refs once. Re-running querySelector for all four
      // parts of every label on every frame was pure waste, and it scaled
      // straight up with the label count.
      peak.elRot = el.querySelector('.rot');
      peak.elName = el.querySelector('.name');
      peak.elDist = el.querySelector('.dist');
      peak.elLine = el.querySelector('.line');
      peak.elName.textContent = peak.name; // never changes for a given peak
      peak.lastDist = null;
      peak.lastOpacity = null;
      peak.lastLineH = null;
    }
    peak.el.style.display = '';
    // The element is a zero-size anchor sitting exactly on the summit.
    peak.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`;
    // Text writes are the expensive kind (they re-shape the glyphs), so only
    // when the shown value actually changes.
    const distText = `${(distance / 1000).toFixed(1)} km / ${peak.elev} m`;
    if (peak.lastDist !== distText) {
      peak.elDist.textContent = distText;

      peak.lastOpacity = opacity;

    // text then takes off from the top of that line.

      peak.elRot.style.bottom = lineH + 'px';

// to a rectangle, so those tiles are never requested or drawn at all.
// ---- Day/night. Cesium already knows where the sun is for any given
// instant, so "time of day" is really just moving the clock: globe lighting
// then shades terrain by the real sun angle. That makes low morning/evening
// light rake across the ridges the way it did on the actual walk, which is
// far more revealing of shape than flat midday light.

  [0,  '#070b16'], [4,  '#0d1526'], [5.5,'#3a4a6b'], [6.5,'#c2764f'],
  [8,  '#8fc6ea'], [16, '#8fc6ea'], [17.5,'#d1834f'], [19,'#2c3555'],
  [20, '#0d1526'], [24, '#070b16'],

  let a = SKY_KEYFRAMES[0], b = SKY_KEYFRAMES[SKY_KEYFRAMES.length - 1];
  for (let i = 0; i < SKY_KEYFRAMES.length - 1; i++) {
    if (h >= SKY_KEYFRAMES[i][0] && h <= SKY_KEYFRAMES[i + 1][0]) {
      a = SKY_KEYFRAMES[i]; b = SKY_KEYFRAMES[i + 1]; break;
    }

  const span = b[0] - a[0];
  const t = span > 0 ? (h - a[0]) / span : 0;

    Cesium.Color.fromCssColorString(a[1]),
